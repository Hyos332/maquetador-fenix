[project]
name = "mls-maquetador-backend"
version = "0.1.0"
description = "Backend local para automatizar la maquetacion de articulos MLS Journals."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128.0",
  "lxml>=6.0.0",
  "pillow>=10.0.0",
  "playwright>=1.55.0",
  "pydantic>=2.10.0",
  "python-multipart>=0.0.20",
  "python-docx>=1.1.0",
  "pyyaml>=6.0.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
mls-maquetador = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
